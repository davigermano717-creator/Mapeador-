
name: Build MAPEADOR APK

on:
  push:
    branches: [ principal ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Organizar arquivos Android
        run: |
          mkdir -p app/src/main/java/com/mapeador/app
          mkdir -p app/src/main/assets

          mv app/AndroidManifest.xml app/src/main/
          mv app/MainActivity.kt app/src/main/java/com/mapeador/app/
          mv app/mapeador.html app/src/main/assets/

      - name: Compilar APK
        run: gradle assembleDebug

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: MAPEADOR-debug
          path: app/build/outputs/apk/debug/*.apk
          
